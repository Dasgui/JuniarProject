services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_USER: Comix
      POSTGRES_PASSWORD: tron
      POSTGRES_DB: product-store
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Comix -d product-store"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migration:
    build:
      context: ./
      dockerfile: internal/migrations/Dockerfile
    container_name: migration-runner
    env_file:
      - .env
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=${DB_PORT} user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} sslmode=disable"
      GOOSE_MIGRATION_DIR: /app/migrations
    command:
      - sh
      - -c
      - |
        goose up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: shop-api
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SERVER_PORT: 8081
      DB_USER: Comix
      DB_PASSWORD: tron
      DB_NAME: product-store
    restart: unless-stopped

volumes:
  postgres-data: